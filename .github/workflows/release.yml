name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use version from shareman.csproj, e.g. v1.0.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build & Package Release
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_release.ps1 -NoPause

          [xml]$projXml = Get-Content shareman.csproj
          $version = $projXml.Project.PropertyGroup.Version
          if (-not $version) { $version = '1.0.0' }

          if ('${{ github.ref_type }}' -eq 'tag') {
              $tag = '${{ github.ref_name }}'
          } elseif (-not [string]::IsNullOrWhiteSpace('${{ inputs.tag_name }}')) {
              $tag = '${{ inputs.tag_name }}'.Trim()
          } else {
              $tag = "v$version"
          }

          $title = "shareman $tag"

          $zipItem = Get-ChildItem -Path "bin\Release\net9.0-windows\win-x64\shareman-*.zip" | Select-Object -First 1
          if (-not $zipItem -or -not (Test-Path -LiteralPath $zipItem.FullName)) {
              throw "Release archive was not found in bin\Release\net9.0-windows\win-x64!"
          }

          Write-Host "Found release archive: $($zipItem.FullName)"
          Write-Host "Release tag: $tag"
          Write-Host "Release title: $title"

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ZIP=$($zipItem.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.RELEASE_ZIP }}
